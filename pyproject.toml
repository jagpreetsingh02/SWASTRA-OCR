[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medikiosk-ocr"
version = "2.0.0"
description = "Medical document OCR and structured extraction engine for MediKiosk"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5",
    "transformers>=5.0",
    "gliner>=0.2.20",
    "pillow>=11",
    "pillow-heif>=0.18",
    "pypdfium2>=5.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["medikiosk_ocr"]

[tool.setuptools.package-data]
medikiosk_ocr = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning", "ignore::pytest.PytestCollectionWarning"]
